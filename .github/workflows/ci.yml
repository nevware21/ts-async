# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: "NodeCI"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096    

    strategy:
      matrix:
        node: [ 18, 20, 22, 24 ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
    - name: Update rush shrinkwrap dependencies
      run: node common/scripts/install-run-rush.js update --full
    - name: Npm Install
      run: npm install
    - name: Build
      run: npm run build --verbose
      timeout-minutes: 15
    - name: Unit tests
      run: node common/scripts/install-run-rush.js test --verbose
      timeout-minutes: 15

    - name: Report Coverage
      run: npm run codecov
    
    - name: Upload Coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/coverage-final.json
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Size tests
      if: matrix.node == 24 || matrix.node == 22 # size-limit 13.x requires Node 22+ (uses node:fs/promises glob)
      run: npm run size

    - name: Bundle Size Checks
      run: npm run size-check

    - name: Docs link check
      run: npm run readme-link-check
